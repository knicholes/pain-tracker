// ─── IndexedDB ───────────────────────────────────────────────────────────────
const DB_NAME = "BodyTracker", DB_VERSION = 1, STORE = "logs";
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((res, rej) => { const r = db.transaction(STORE,"readonly").objectStore(STORE).get(key); r.onsuccess = e => res(e.target.result); r.onerror = e => rej(e.target.error); });
}
async function dbSet(key, value) {
  const db = await openDB();
  return new Promise((res, rej) => { const r = db.transaction(STORE,"readwrite").objectStore(STORE).put(value, key); r.onsuccess = () => res(); r.onerror = e => rej(e.target.error); });
}

const SEVERITY = ["Mild","Moderate","Severe"];

const SEV_COLOR_PRINT = { Mild:"#b45309", Moderate:"#c2410c", Severe:"#b91c1c" };

function fmt(ts) { return new Date(ts).toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function labelForId(id) { return ALL_PARTS.find(p=>p.id===id)?.label || id; }

// ─── Export helpers ──────────────────────────────────────────────────────────
function buildCSV(logs) {
  const rows = [["Area","Severity","Date/Time","Notes"]];
  const allEntries = [];
  for (const [id, entries] of Object.entries(logs)) {
    for (const e of entries) allEntries.push({ label: labelForId(id), ...e });
  }
  allEntries.sort((a,b) => b.ts - a.ts);
  for (const e of allEntries) {
    rows.push([`"${e.label}"`, e.severity, fmt(e.ts), `"${e.note.replace(/"/g,'""')}"`]);
  }
  return rows.map(r => r.join(",")).join("\n");
}

function downloadCSV(logs) {
  const csv = buildCSV(logs);
  const blob = new Blob([csv], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `symptom-log-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function buildSummaryHTML(logs, patientName) {
  const allEntries = [];
  for (const [id, entries] of Object.entries(logs)) {
    for (const e of entries) allEntries.push({ label: labelForId(id), ...e });
  }
  allEntries.sort((a,b) => b.ts - a.ts);
  const affectedAreas = [...new Set(allEntries.map(e => e.label))];

  const rows = allEntries.map(e => `
    <tr>
      <td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;font-weight:500">${e.label}</td>
      <td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;color:${SEV_COLOR_PRINT[e.severity]};font-weight:bold">${e.severity}</td>
      <td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;white-space:nowrap;color:#6b7280;font-size:13px">${fmt(e.ts)}</td>
      <td style="padding:8px 12px;border-bottom:1px solid #e5e7eb">${e.note}</td>
    </tr>`).join("");

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
  <title>Symptom Report</title>
  <style>
    body { font-family: Georgia, serif; max-width: 800px; margin: 40px auto; padding: 0 24px; color: #111; }
    h1 { font-size: 26px; margin-bottom: 4px; }
    .meta { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    .summary { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 20px; margin-bottom: 28px; }
    .summary h2 { font-size: 15px; margin-bottom: 8px; color: #374151; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: #e0f2fe; color: #0369a1; border-radius: 20px; padding: 3px 12px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f3f4f6; padding: 10px 12px; text-align: left; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: #6b7280; }
    @media print { body { margin: 20px; } }
  </style></head><body>
  <h1>Symptom Log Report</h1>
  <div class="meta">
    ${patientName ? `<b>Patient:</b> ${patientName} &nbsp;·&nbsp; ` : ""}
    <b>Generated:</b> ${fmt(Date.now())} &nbsp;·&nbsp;
    <b>Total entries:</b> ${allEntries.length}
  </div>
  <div class="summary">
    <h2>Affected Areas (${affectedAreas.length})</h2>
    <div class="tags">${affectedAreas.map(a=>`<span class="tag">${a}</span>`).join("")}</div>
  </div>
  <table>
    <thead><tr><th>Area</th><th>Severity</th><th>Date / Time</th><th>Notes</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </body></html>`;
}

function downloadHTML(logs, patientName) {
  const html = buildSummaryHTML(logs, patientName);
  const blob = new Blob([html], { type:"text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `symptom-report-${new Date().toISOString().slice(0,10)}.html`;
  a.click(); URL.revokeObjectURL(url);
}

function printReport(logs, patientName) {
  const html = buildSummaryHTML(logs, patientName);
  const win = window.open("","_blank");
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 400);
}

// ─── Body SVG ────────────────────────────────────────────────────────────────
function BodySVG({ parts, logs, onTap, onLongPress, multiSelect, selectedIds }) {
  const timers = React.useRef({});
  function color(id) {
    if (multiSelect && selectedIds.includes(id)) return "#38bdf8";
    if (logs[id]?.length) return SEV_COLOR[logs[id][logs[id].length-1].severity];
    return "#c7d2e8";
  }
  function opacity(id) {
    if (multiSelect && selectedIds.includes(id)) return 0.95;
    return logs[id]?.length ? 0.85 : 0.32;
  }
  function stroke(id) {
    if (multiSelect && selectedIds.includes(id)) return "#7dd3fc";
    if (logs[id]?.length) return SEV_COLOR[logs[id][logs[id].length-1].severity];
    return "#475569";
  }
  function startPress(p) { timers.current[p.id] = setTimeout(() => { if (navigator.vibrate) navigator.vibrate(40); onLongPress(p); }, 500); }
  function endPress(p) { clearTimeout(timers.current[p.id]); }
  return (
    <svg viewBox="0 0 320 435" style={{width:"100%",display:"block",padding:"0 10px",touchAction:"none",userSelect:"none"}}>
      <ellipse cx="160" cy="42" rx="26" ry="28" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      <rect x="138" y="68" width="44" height="20" rx="8" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      <path d="M138 88 Q110 95 95 108 L78 175 Q75 195 70 210 L62 240 Q58 255 55 270" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      <path d="M182 88 Q210 95 225 108 L242 175 Q245 195 250 210 L258 240 Q262 255 265 270" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      <rect x="130" y="88" width="60" height="145" rx="14" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      <path d="M135 228 L112 250 Q108 295 108 315 Q108 340 110 365 L110 406 Q112 418 118 420 L126 420 Q132 417 130 410 L128 385" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      <path d="M185 228 L208 250 Q212 295 212 315 Q212 340 210 365 L210 406 Q208 418 202 420 L194 420 Q188 417 190 410 L192 385" fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
      {parts.map(p => (
        <g key={p.id} onClick={() => onTap(p)}
          onTouchStart={() => startPress(p)} onTouchEnd={() => endPress(p)} onTouchMove={() => endPress(p)}
          style={{cursor:"pointer"}}>
          <circle cx={p.cx} cy={p.cy} r={p.r+10} fill="transparent"/>
          <circle cx={p.cx} cy={p.cy} r={p.r} fill={color(p.id)} opacity={opacity(p.id)} stroke={stroke(p.id)} strokeWidth={multiSelect&&selectedIds.includes(p.id)?3:logs[p.id]?.length?2:1}/>
          {multiSelect&&selectedIds.includes(p.id)&&<text x={p.cx} y={p.cy+1} textAnchor="middle" dominantBaseline="middle" fontSize="12" fill="#0f172a" fontWeight="bold">✓</text>}
          {!multiSelect&&logs[p.id]?.length>0&&<text x={p.cx} y={p.cy+1} textAnchor="middle" dominantBaseline="middle" fontSize="11" fill="#fff" fontWeight="bold">{logs[p.id].length}</text>}
        </g>
      ))}
    </svg>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [logs, setLogs] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [view, setView] = React.useState("map");
  const [side, setSide] = React.useState("front");
  const [selected, setSelected] = React.useState(null);
  const [multiSelect, setMultiSelect] = React.useState(false);
  const [selectedIds, setSelectedIds] = React.useState([]);
  const [form, setForm] = React.useState({ note:"", severity:"Mild" });
  const [showExport, setShowExport] = React.useState(false);

  React.useEffect(() => {
    dbGet("logs").then(data => { if (data) setLogs(data); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  async function saveLogs(next) { setLogs(next); try { await dbSet("logs", next); } catch(e) { console.error(e); } }

  function handleTap(p) {
    if (multiSelect) { setSelectedIds(prev => prev.includes(p.id) ? prev.filter(id=>id!==p.id) : [...prev, p.id]); }
    else { setSelected(p); setView("detail"); }
  }
  function handleLongPress(p) { if (!multiSelect) { setMultiSelect(true); setSelectedIds([p.id]); } }
  function cancelMulti() { setMultiSelect(false); setSelectedIds([]); }

  async function saveEntry() {
    if (!form.note.trim()) return;
    const entry = { note:form.note.trim(), severity:form.severity, ts:Date.now() };
    await saveLogs({ ...logs, [selected.id]: [...(logs[selected.id]||[]), entry] });
    setForm({ note:"", severity:"Mild" }); setView("detai
